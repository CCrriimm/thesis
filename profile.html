<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tom's Chicken - My Profile</title>
    
    <link href="Bootstrap/Content/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root { --toms-orange: #f57d10ff; --toms-dark: #212529; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding-bottom: 50px; }
        
        .navbar { box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .mobile-container { max-width: 600px; margin: 0 auto; padding: 15px; }
        @media (min-width: 768px) {
            .mobile-container { max-width: 95%; padding: 20px 25px; }
        }
        @media (min-width: 992px) {
            .mobile-container { max-width: 1160px; padding: 25px 30px; }
        }
        @media (min-width: 1300px) {
            .mobile-container { max-width: 1260px; }
        }

        .sticky-profile-sidebar {
            position: static;
        }
        @media (min-width: 992px) {
            .sticky-profile-sidebar {
                position: sticky;
                top: 85px;
                z-index: 10;
            }
        }

        /* PROFILE CARD */
        .profile-card {
            background: white; border-radius: 15px; border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); padding: 25px 20px;
            text-align: center; margin-bottom: 20px;
        }
        .profile-avatar {
            width: 85px; height: 85px; background-color: var(--toms-orange); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: bold; margin: 0 auto 15px auto;
            box-shadow: 0 4px 12px rgba(245, 125, 16, 0.3);
        }

        /* TABS */
        .nav-pills .nav-link { color: var(--toms-dark); font-weight: bold; border-radius: 50px; padding: 8px 20px; transition: 0.2s; }
        .nav-pills .nav-link.active { background-color: var(--toms-orange); color: white; }

        /* ITEM CARDS (Reservations & Orders) */
        .item-card {
            background: white; border-radius: 12px; border: 1px solid #eee;
            padding: 16px; position: relative; height: 100%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: flex; flex-direction: column; justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .item-card:hover {
            box-shadow: 0 6px 16px rgba(0,0,0,0.07);
        }
        .item-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 12px; }
        .status-badge { font-size: 0.75rem; padding: 5px 12px; border-radius: 50px; font-weight: bold; }
        
        .btn-orange-outline { border: 2px solid var(--toms-orange); color: var(--toms-orange); border-radius: 50px; font-weight: bold; transition: 0.2s; }
        .btn-orange-outline:hover { background-color: var(--toms-orange); color: white; }
        .cursor-pointer { cursor: pointer; transition: 0.2s; }
        .cursor-pointer:hover { color: var(--toms-orange) !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container mobile-container py-0 d-flex justify-content-between">
            <a class="navbar-brand fw-bold fs-4" href="index.html" style="color: var(--toms-orange);">
                <i class="fa-solid fa-arrow-left text-dark me-2" onclick="history.back(); return false;"></i> 
                Tom's<span class="text-dark">Chicken</span>
            </a>
            <button id="logoutBtn" class="btn btn-sm btn-dark rounded-pill px-3">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container mobile-container mt-3 mt-md-4">
        <div class="row g-4">
            <!-- Left Column: Profile Card -->
            <div class="col-lg-4">
                <div class="sticky-profile-sidebar">
                    <div class="profile-card">
                        <div class="profile-avatar" id="userInitial">?</div>
                        
                        <div id="profileViewMode">
                            <h4 class="fw-bold mb-0" id="userName">Loading...</h4>
                            <button class="btn btn-link text-muted p-0 mb-3 small text-decoration-none" onclick="toggleEditMode(true)">
                                <i class="fa-solid fa-pen-to-square"></i> Edit Name
                            </button>
                        </div>

                        <div id="profileEditMode" class="d-none mb-3 px-2">
                            <div class="row g-2 mb-2">
                                <div class="col-6">
                                    <input type="text" id="editFirstName" class="form-control text-center form-control-sm" placeholder="First Name">
                                </div>
                                <div class="col-6">
                                    <input type="text" id="editLastName" class="form-control text-center form-control-sm" placeholder="Last Name">
                                </div>
                            </div>
                            <div class="d-flex gap-2 justify-content-center">
                                <button class="btn btn-sm btn-success px-3 fw-bold" id="saveNameBtn">Save</button>
                                <button class="btn btn-sm btn-secondary px-3" onclick="toggleEditMode(false)">Cancel</button>
                            </div>
                            <div id="profileEditError" class="alert alert-danger py-1 px-2 mt-2 mb-0 small d-none"></div>
                        </div>

                        <div class="p-3 bg-light rounded-3 text-start mb-3 border">
                            <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
                                <span class="text-muted small"><i class="fa-solid fa-envelope me-2 text-warning"></i>Email</span>
                                <div class="d-flex align-items-center">
                                    <span id="userEmail" class="fw-bold small me-2">Loading...</span>
                                    <i class="fa-solid fa-eye-slash text-muted cursor-pointer" id="toggleEmailIcon" title="Toggle visibility"></i>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted small"><i class="fa-solid fa-phone me-2 text-warning"></i>Mobile</span>
                                <div class="d-flex align-items-center">
                                    <span id="userPhone" class="fw-bold small me-2">Loading...</span>
                                    <i class="fa-solid fa-eye-slash text-muted cursor-pointer" id="togglePhoneIcon" title="Toggle visibility"></i>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <a href="Resetpass.html" class="btn btn-orange-outline btn-sm py-2">
                                <i class="fa-solid fa-lock me-1"></i> Change Password
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Tabs & Lists -->
            <div class="col-lg-8">
                <div class="bg-white p-3 p-md-4 rounded-4 shadow-sm border mb-4">
                    <ul class="nav nav-pills mb-4 gap-2" id="profileTabs">
                        <li class="nav-item">
                            <a class="nav-link active px-4 py-2" href="#" onclick="switchTab('reservations', event)">
                                <i class="fa-solid fa-calendar-check me-2"></i> My Reservations
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-4 py-2" href="#" onclick="switchTab('orders', event)">
                                <i class="fa-solid fa-bag-shopping me-2"></i> My Pickup Orders
                            </a>
                        </li>
                    </ul>

                    <div id="reservationsSection">
                        <div id="reservationsList" class="row g-3">
                            <p class="text-center text-muted py-4 col-12"><i class="fa-solid fa-spinner fa-spin"></i> Loading reservations...</p>
                        </div>
                    </div>

                    <div id="ordersSection" class="d-none">
                        <div id="ordersList" class="row g-3">
                            <p class="text-center text-muted py-4 col-12"><i class="fa-solid fa-spinner fa-spin"></i> Loading orders...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Customer Cancel Modal (5 Common Reasons + Others) -->
    <div class="modal fade" id="customerCancelModal" tabindex="-1" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 overflow-hidden shadow-lg">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title fw-bold" id="customerCancelModalTitle"><i class="fa-solid fa-triangle-exclamation me-2"></i> Cancel Booking</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4 bg-light">
            <p class="text-muted small mb-3">Please let us know why you are cancelling. This helps us improve our service.</p>
            <div id="customerCancelErrorAlert" class="alert alert-danger d-none py-2 px-3 small fw-bold mb-3"></div>

            <label class="form-label fw-bold small text-dark">Reason for Cancellation:</label>
            <div class="space-y-2 mb-3">
              <div class="form-check p-2 bg-white rounded border mb-2">
                <input class="form-check-input ms-0 me-2" type="radio" name="custCancelReasonRadio" id="ccReason1" value="Change of Schedule / Unforeseen Conflict" checked>
                <label class="form-check-label fw-bold small" for="ccReason1">
                  1. Change of Schedule / Unforeseen Conflict
                </label>
              </div>
              <div class="form-check p-2 bg-white rounded border mb-2">
                <input class="form-check-input ms-0 me-2" type="radio" name="custCancelReasonRadio" id="ccReason2" value="Selected Wrong Date, Time, or Table">
                <label class="form-check-label fw-bold small" for="ccReason2">
                  2. Selected Wrong Date, Time, or Table
                </label>
              </div>
              <div class="form-check p-2 bg-white rounded border mb-2">
                <input class="form-check-input ms-0 me-2" type="radio" name="custCancelReasonRadio" id="ccReason3" value="Accidental / Duplicate Order or Reservation">
                <label class="form-check-label fw-bold small" for="ccReason3">
                  3. Accidental / Duplicate Order or Reservation
                </label>
              </div>
              <div class="form-check p-2 bg-white rounded border mb-2">
                <input class="form-check-input ms-0 me-2" type="radio" name="custCancelReasonRadio" id="ccReason4" value="Change of Mind / Group Plans Cancelled">
                <label class="form-check-label fw-bold small" for="ccReason4">
                  4. Change of Mind / Group Plans Cancelled
                </label>
              </div>
              <div class="form-check p-2 bg-white rounded border mb-2">
                <input class="form-check-input ms-0 me-2" type="radio" name="custCancelReasonRadio" id="ccReason5" value="Emergency / Transportation or Weather Issue">
                <label class="form-check-label fw-bold small" for="ccReason5">
                  5. Emergency / Transportation or Weather Issue
                </label>
              </div>
              <div class="form-check p-2 bg-white rounded border mb-2">
                <input class="form-check-input ms-0 me-2" type="radio" name="custCancelReasonRadio" id="ccReasonOther" value="Others">
                <label class="form-check-label fw-bold small" for="ccReasonOther">
                  6. Others (Please specify below)
                </label>
              </div>
            </div>

            <div id="custCustomReasonWrap" class="d-none mt-2">
              <label class="form-label fw-bold small text-muted">Specify Reason:</label>
              <textarea id="custCustomReasonText" class="form-control" rows="3" placeholder="Type reason for cancelling..."></textarea>
            </div>
          </div>
          <div class="modal-footer justify-content-end bg-white border-top">
            <button type="button" class="btn btn-secondary px-3" data-bs-dismiss="modal">Back</button>
            <button type="button" id="confirmCustomerCancelBtn" class="btn btn-danger px-4 fw-bold">
              <i class="fa-solid fa-xmark me-1"></i> Confirm Cancellation
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="Bootstrap/Scripts/bootstrap.bundle.min.js"></script>
    <script type="module">
        // Added 'update' and 'remove' to the imports for profile and cancellation features
        import { auth, db, ref, get, update, remove, onValue, onAuthStateChanged, signOut } from "./js/firebase-config.js";

        let currentUserUid = "";
        let currentUserName = "";
        
        // Data states for masking/unmasking
        let rawData = { email: "", phone: "", firstName: "", lastName: "" };
        let showEmail = false;
        let showPhone = false;

        // Masking Helpers
        function maskEmail(email) {
            if (!email) return "No email linked";
            const [name, domain] = email.split('@');
            if (name.length <= 2) return email; 
            return name.substring(0, 2) + '*'.repeat(name.length - 2) + '@' + domain;
        }

        function maskPhone(phone) {
            if (!phone || phone === "N/A") return "No phone linked";
            if (phone.length < 6) return phone;
            return phone.substring(0, 3) + '*'.repeat(phone.length - 6) + phone.substring(phone.length - 3);
        }

        // 1. SECURITY & PROFILE LOAD
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                currentUserUid = user.uid;
                
                const snap = await get(ref(db, 'users/' + user.uid));
                if (snap.exists()) {
                    const data = snap.val();
                    rawData.firstName = data.firstName || "";
                    rawData.lastName = data.lastName || "";
                    rawData.email = data.email || "";
                    rawData.phone = data.phone || "N/A"; // fallback if phone isn't in DB yet
                    
                    updateProfileUI();

                    // Start fetching their records
                    loadMyReservations();
                    loadMyOrders();
                }
            }
        });

        function updateProfileUI() {
            currentUserName = `${rawData.firstName} ${rawData.lastName}`;
            document.getElementById('userName').innerText = currentUserName;
            document.getElementById('userInitial').innerText = rawData.firstName.charAt(0).toUpperCase() || "?";
            
            // Set Masked Displays initially
            document.getElementById('userEmail').innerText = showEmail ? rawData.email : maskEmail(rawData.email);
            document.getElementById('userPhone').innerText = showPhone ? rawData.phone : maskPhone(rawData.phone);
        }

        // EYE TOGGLE LISTENERS
        document.getElementById('toggleEmailIcon').addEventListener('click', function() {
            showEmail = !showEmail;
            document.getElementById('userEmail').innerText = showEmail ? rawData.email : maskEmail(rawData.email);
            this.className = showEmail ? "fa-solid fa-eye text-primary cursor-pointer" : "fa-solid fa-eye-slash text-muted cursor-pointer";
        });

        document.getElementById('togglePhoneIcon').addEventListener('click', function() {
            showPhone = !showPhone;
            document.getElementById('userPhone').innerText = showPhone ? rawData.phone : maskPhone(rawData.phone);
            this.className = showPhone ? "fa-solid fa-eye text-primary cursor-pointer" : "fa-solid fa-eye-slash text-muted cursor-pointer";
        });

        // EDIT PROFILE LOGIC
        window.toggleEditMode = function(show) {
            if (show) {
                document.getElementById('profileViewMode').classList.add('d-none');
                document.getElementById('profileEditMode').classList.remove('d-none');
                document.getElementById('editFirstName').value = rawData.firstName;
                document.getElementById('editLastName').value = rawData.lastName;
            } else {
                document.getElementById('profileViewMode').classList.remove('d-none');
                document.getElementById('profileEditMode').classList.add('d-none');
            }
        }

        document.getElementById('saveNameBtn').addEventListener('click', async () => {
            const newFirst = document.getElementById('editFirstName').value.trim();
            const newLast = document.getElementById('editLastName').value.trim();
            const btn = document.getElementById('saveNameBtn');
            const errBox = document.getElementById('profileEditError');
            if (errBox) errBox.classList.add('d-none');

            if (!newFirst || !newLast) {
                if (errBox) {
                    errBox.textContent = "First and Last name cannot be empty.";
                    errBox.classList.remove('d-none');
                }
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                await update(ref(db, 'users/' + currentUserUid), {
                    firstName: newFirst,
                    lastName: newLast
                });

                rawData.firstName = newFirst;
                rawData.lastName = newLast;
                updateProfileUI();
                toggleEditMode(false);
            } catch (error) {
                if (errBox) {
                    errBox.textContent = "Error updating profile. Please try again.";
                    errBox.classList.remove('d-none');
                }
            } finally {
                btn.innerHTML = 'Save';
                btn.disabled = false;
            }
        });

        // 2. TAB SWITCHER
        window.switchTab = function(tabName, event) {
            event.preventDefault();
            document.querySelectorAll('#profileTabs .nav-link').forEach(link => link.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (tabName === 'reservations') {
                document.getElementById('reservationsSection').classList.remove('d-none');
                document.getElementById('ordersSection').classList.add('d-none');
            } else {
                document.getElementById('reservationsSection').classList.add('d-none');
                document.getElementById('ordersSection').classList.remove('d-none');
            }
        }

        function formatTo12Hour(timeStr) {
            if (!timeStr) return "";
            if (timeStr.includes("AM") || timeStr.includes("PM")) return timeStr;
            const match = timeStr.trim().match(/^(\d{1,2}):(\d{2})$/);
            if (match) {
                let h = parseInt(match[1], 10);
                const m = match[2];
                const ampm = h >= 12 ? "PM" : "AM";
                h = h % 12 || 12;
                return `${h}:${m} ${ampm}`;
            }
            return timeStr;
        }

        // Customer Cancellation Logic
        let pendingCancelType = null;
        let pendingCancelId = null;
        let pendingCancelDate = null;
        let pendingCancelTime = null;
        let pendingCancelTable = null;
        let customerCancelModalInstance = null;

        document.querySelectorAll('input[name="custCancelReasonRadio"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const wrap = document.getElementById('custCustomReasonWrap');
                if (wrap) {
                    if (e.target.value === 'Others') {
                        wrap.classList.remove('d-none');
                    } else {
                        wrap.classList.add('d-none');
                    }
                }
            });
        });

        window.openCustomerCancel = function(type, id, date = null, time = null, tableSize = null) {
            pendingCancelType = type;
            pendingCancelId = id;
            pendingCancelDate = date;
            pendingCancelTime = time;
            pendingCancelTable = tableSize;

            const modalTitle = document.getElementById('customerCancelModalTitle');
            if (modalTitle) {
                modalTitle.innerHTML = type === 'reservation' 
                    ? `<i class="fa-solid fa-triangle-exclamation me-2"></i> Cancel Reservation`
                    : `<i class="fa-solid fa-triangle-exclamation me-2"></i> Cancel Pickup Order`;
            }

            const r1 = document.getElementById('ccReason1');
            if (r1) r1.checked = true;
            const wrap = document.getElementById('custCustomReasonWrap');
            if (wrap) wrap.classList.add('d-none');
            const customText = document.getElementById('custCustomReasonText');
            if (customText) customText.value = '';
            const errAlert = document.getElementById('customerCancelErrorAlert');
            if (errAlert) errAlert.classList.add('d-none');

            if (!customerCancelModalInstance) {
                customerCancelModalInstance = new bootstrap.Modal(document.getElementById('customerCancelModal'));
            }
            customerCancelModalInstance.show();
        };

        document.getElementById('confirmCustomerCancelBtn').addEventListener('click', async () => {
            const errAlert = document.getElementById('customerCancelErrorAlert');
            if (errAlert) errAlert.classList.add('d-none');

            const selectedRadio = document.querySelector('input[name="custCancelReasonRadio"]:checked');
            let finalReason = selectedRadio ? selectedRadio.value : "";
            if (finalReason === 'Others') {
                const customVal = document.getElementById('custCustomReasonText').value.trim();
                if (!customVal) {
                    if (errAlert) {
                        errAlert.textContent = "Please provide details for the cancellation reason.";
                        errAlert.classList.remove('d-none');
                    }
                    return;
                }
                finalReason = customVal;
            }

            const btn = document.getElementById('confirmCustomerCancelBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Cancelling...';

            try {
                if (pendingCancelType === 'reservation') {
                    await update(ref(db, `reservations/${pendingCancelId}`), {
                        status: 'cancelled',
                        rejectionReason: finalReason,
                        cancellationReason: finalReason,
                        cancelledBy: 'customer',
                        cancelledAt: Date.now()
                    });

                    if (pendingCancelDate && pendingCancelTime && pendingCancelTable) {
                        const tableMatch = pendingCancelTable.match(/Table (\d+)/i);
                        if (tableMatch) {
                            const tableId = "table_" + tableMatch[1];
                            try {
                                await remove(ref(db, `reservationSlots/${pendingCancelDate}/${pendingCancelTime}/tables/${tableId}`));
                            } catch (slotErr) {
                                console.warn("Could not remove slot:", slotErr);
                            }
                        }
                    }

                    // Cancel linked payment in payments node
                    try {
                        const paySnap = await get(ref(db, 'payments'));
                        if (paySnap.exists()) {
                            paySnap.forEach((child) => {
                                const pData = child.val();
                                if (child.key === pendingCancelId || pData.reservationId === pendingCancelId) {
                                    update(ref(db, `payments/${child.key}`), {
                                        status: 'cancelled',
                                        rejectionReason: finalReason,
                                        cancellationReason: finalReason,
                                        cancelledBy: 'customer',
                                        cancelledAt: Date.now()
                                    });
                                }
                            });
                        }
                    } catch (pErr) {
                        console.warn("Could not sync payment cancellation:", pErr);
                    }
                } else if (pendingCancelType === 'order') {
                    await update(ref(db, `orders/${pendingCancelId}`), {
                        status: 'cancelled',
                        rejectionReason: finalReason,
                        cancellationReason: finalReason,
                        cancelledBy: 'customer',
                        cancelledAt: Date.now()
                    });

                    // Cancel linked payment in payments node
                    try {
                        const paySnap = await get(ref(db, 'payments'));
                        if (paySnap.exists()) {
                            paySnap.forEach((child) => {
                                const pData = child.val();
                                if (child.key === pendingCancelId || pData.orderId === pendingCancelId) {
                                    update(ref(db, `payments/${child.key}`), {
                                        status: 'cancelled',
                                        rejectionReason: finalReason,
                                        cancellationReason: finalReason,
                                        cancelledBy: 'customer',
                                        cancelledAt: Date.now()
                                    });
                                }
                            });
                        }
                    } catch (pErr) {
                        console.warn("Could not sync payment cancellation:", pErr);
                    }
                }

                if (customerCancelModalInstance) {
                    customerCancelModalInstance.hide();
                }
            } catch (err) {
                if (errAlert) {
                    errAlert.textContent = "Failed to cancel: " + err.message;
                    errAlert.classList.remove('d-none');
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-xmark me-1"></i> Confirm Cancellation';
            }
        });

        // 3. LOAD RESERVATIONS (Real-time)
        function loadMyReservations() {
            onValue(ref(db, 'reservations'), (snapshot) => {
                const container = document.getElementById('reservationsList');
                container.innerHTML = '';
                let hasData = false;

                if (snapshot.exists()) {
                    let myRes = [];
                    snapshot.forEach(child => {
                        let data = child.val();
                        if (data.name === currentUserName) {
                            myRes.push({ id: child.key, ...data });
                        }
                    });

                    myRes.sort((a,b) => new Date(b.date + " " + b.time) - new Date(a.date + " " + a.time));

                    myRes.forEach(r => {
                        hasData = true;
                        
                        let badge = "";
                        if (r.status === "pending") badge = `<span class="status-badge bg-warning text-dark"><i class="fa-solid fa-clock me-1"></i> Pending Review</span>`;
                        else if (r.status === "approved") badge = `<span class="status-badge bg-success text-white"><i class="fa-solid fa-check me-1"></i> Approved</span>`;
                        else if (r.status === "seated") badge = `<span class="status-badge bg-dark text-white"><i class="fa-solid fa-chair me-1"></i> Currently Seated</span>`;
                        else if (r.status === "completed") badge = `<span class="status-badge bg-secondary text-white">Completed</span>`;
                        else if (r.status === "cancelled") badge = `<span class="status-badge bg-danger text-white"><i class="fa-solid fa-ban me-1"></i> Cancelled</span>`;
                        else badge = `<span class="status-badge bg-danger text-white"><i class="fa-solid fa-xmark me-1"></i> Rejected</span>`;

                        let advanceBadge = "";
                        if (r.notes && r.notes.includes("[ADVANCE ORDER]")) {
                            advanceBadge = `<div class="mt-2 small p-2 bg-light border rounded"><i class="fa-solid fa-utensils text-warning me-1"></i> <b>Advance Order:</b> ${r.notes.replace("[ADVANCE ORDER]", "").split("[NOTES]")[0].trim()}</div>`;
                        }

                        let reasonBanner = "";
                        if (r.status === "cancelled" || r.status === "rejected") {
                            const reasonText = r.rejectionReason || r.cancellationReason || "No specific reason provided.";
                            const reasonLabel = r.status === 'cancelled' 
                                ? (r.cancelledBy === 'customer' ? 'Cancellation Reason:' : 'Cancelled by Restaurant:') 
                                : 'Rejection Reason:';
                            reasonBanner = `
                                <div class="alert alert-danger py-2 px-3 small mt-2 mb-0 border-0 rounded-3">
                                    <div class="fw-bold text-danger mb-1"><i class="fa-solid fa-circle-exclamation me-1"></i> ${reasonLabel}</div>
                                    <span class="text-dark">${reasonText}</span>
                                </div>
                            `;
                        }

                        let cancelBtn = "";
                        if (r.status === "pending") {
                            const safeTableSize = (r.tableSize || "").replace(/'/g, "\\'");
                            cancelBtn = `
                                <div class="mt-2 pt-2 border-top d-flex justify-content-end">
                                    <button type="button" onclick="openCustomerCancel('reservation', '${r.id}', '${r.date}', '${r.time}', '${safeTableSize}')" class="btn btn-sm btn-outline-danger">
                                        <i class="fa-solid fa-ban me-1"></i> Cancel Reservation
                                    </button>
                                </div>
                            `;
                        }

                        container.innerHTML += `
                            <div class="col-md-6 col-12">
                                <div class="item-card">
                                    <div>
                                        <div class="item-header">
                                            <span class="fw-bold text-muted small"><i class="fa-solid fa-hashtag"></i> ${r.id.substring(1, 6).toUpperCase()}</span>
                                            ${badge}
                                        </div>
                                        <h5 class="fw-bold mb-1" style="color: var(--toms-orange);">${r.date}</h5>
                                        <p class="text-muted mb-2 small"><i class="fa-regular fa-clock me-1"></i> ${r.time} &nbsp;|&nbsp; <i class="fa-solid fa-users me-1"></i> ${r.pax} Guests</p>
                                        <div class="small text-dark bg-light px-2 py-1 rounded border d-inline-block mb-2"><b>Table:</b> ${r.tableSize}</div>
                                        ${advanceBadge}
                                        ${reasonBanner}
                                    </div>
                                    ${cancelBtn}
                                </div>
                            </div>
                        `;
                    });
                }

                if (!hasData) {
                    container.innerHTML = `<div class="col-12 text-center text-muted py-5"><i class="fa-solid fa-calendar-xmark fa-3x mb-3 opacity-25"></i><p class="mb-0">You have no reservations yet.</p></div>`;
                }
            });
        }

        // 4. LOAD ONLINE ORDERS (Real-time)
        function loadMyOrders() {
            onValue(ref(db, 'orders'), (snapshot) => {
                const container = document.getElementById('ordersList');
                container.innerHTML = '';
                let hasData = false;

                if (snapshot.exists()) {
                    let myOrders = [];
                    snapshot.forEach(child => {
                        let data = child.val();
                        if (data.customerName === currentUserName) {
                            myOrders.push({ id: child.key, ...data });
                        }
                    });

                    myOrders.sort((a,b) => b.timestamp - a.timestamp);

                    myOrders.forEach(o => {
                        hasData = true;
                        
                        let badge = "";
                        if (o.status === "pending") badge = `<span class="status-badge bg-warning text-dark"><i class="fa-solid fa-clock me-1"></i> Pending Payment</span>`;
                        else if (o.status === "approved") badge = `<span class="status-badge bg-primary text-white"><i class="fa-solid fa-thumbs-up me-1"></i> Confirmed</span>`;
                        else if (o.status === "preparing") badge = `<span class="status-badge bg-info text-dark"><i class="fa-solid fa-fire-burner me-1"></i> Kitchen is Preparing</span>`;
                        else if (o.status === "done") badge = `<span class="status-badge bg-success text-white"><i class="fa-solid fa-bag-shopping me-1"></i> Ready for Pickup!</span>`;
                        else if (o.status === "claimed") badge = `<span class="status-badge bg-secondary text-white"><i class="fa-solid fa-check-double me-1"></i> Completed & Claimed</span>`;
                        else if (o.status === "cancelled") badge = `<span class="status-badge bg-danger text-white"><i class="fa-solid fa-ban me-1"></i> Cancelled</span>`;
                        else badge = `<span class="status-badge bg-danger text-white"><i class="fa-solid fa-xmark me-1"></i> Rejected</span>`;

                        let orderReasonBanner = "";
                        if (o.status === "cancelled" || o.status === "rejected") {
                            const reasonText = o.rejectionReason || o.cancellationReason || "No specific reason provided.";
                            const reasonLabel = o.status === 'cancelled' 
                                ? (o.cancelledBy === 'customer' ? 'Cancellation Reason:' : 'Cancelled by Restaurant:') 
                                : 'Rejection Reason:';
                            orderReasonBanner = `
                                <div class="alert alert-danger py-2 px-3 small mt-2 mb-0 border-0 rounded-3">
                                    <div class="fw-bold text-danger mb-1"><i class="fa-solid fa-circle-exclamation me-1"></i> ${reasonLabel}</div>
                                    <span class="text-dark">${reasonText}</span>
                                </div>
                            `;
                        }

                        let orderCancelBtn = "";
                        if (o.status === "pending") {
                            orderCancelBtn = `
                                <div class="mt-2 pt-2 border-top d-flex justify-content-end">
                                    <button type="button" onclick="openCustomerCancel('order', '${o.id}')" class="btn btn-sm btn-outline-danger">
                                        <i class="fa-solid fa-ban me-1"></i> Cancel Order
                                    </button>
                                </div>
                            `;
                        }

                        container.innerHTML += `
                            <div class="col-md-6 col-12">
                                <div class="item-card">
                                    <div>
                                        <div class="item-header">
                                            <span class="fw-bold text-muted small"><i class="fa-solid fa-hashtag"></i> ${o.id.substring(1, 6).toUpperCase()}</span>
                                            ${badge}
                                        </div>
                                        <h5 class="fw-bold text-success mb-2">₱${parseFloat(o.total).toFixed(2)}</h5>
                                        <div class="small mb-2 bg-light p-2 rounded border"><b>Items:</b> ${o.items}</div>
                                        ${orderReasonBanner}
                                    </div>
                                    <div class="pt-2 border-top">
                                        <small class="text-muted"><i class="fa-solid fa-person-walking me-1"></i> Pickup Time: <b>${formatTo12Hour(o.pickupTime)}</b></small>
                                    </div>
                                    ${orderCancelBtn}
                                </div>
                            </div>
                        `;
                    });
                }

                if (!hasData) {
                    container.innerHTML = `<div class="col-12 text-center text-muted py-5"><i class="fa-solid fa-bag-shopping fa-3x mb-3 opacity-25"></i><p class="mb-0">You have no online orders yet.</p></div>`;
                }
            });
        }

        // 5. LOGOUT
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>
