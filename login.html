<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Tom's Chicken - Login</title>
    <link href="Bootstrap/Content/bootstrap.min.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <script src="Bootstrap/Scripts/bootstrap.bundle.min.js"></script>

    <style>
      body {
        background-color: #f8f9fa;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        border-radius: 15px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.95);
      }
      #ChickenBG {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }
      .password-container {
        position: relative;
      }
      .toggle-eye {
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        cursor: pointer;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <video
      width="100%"
      height="100%"
      id="ChickenBG"
      autoplay
      loop
      muted
      style="border-radius: 10px"
    >
      <source src="Media/ChickenBG.mp4" type="video/mp4" />
    </video>
    <!-- Session Checking Card (Visible by default while checking auth state) -->
    <div id="sessionCheckCard" class="card login-card shadow-lg border-0 text-center p-4">
      <div class="card-body py-4">
        <div class="spinner-border mx-auto mb-3" style="color: #f57d10ff; width: 2.75rem; height: 2.75rem;" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <h5 class="fw-bold mb-1" id="sessionStatusTitle">Checking session...</h5>
        <small class="text-muted" id="sessionStatusMsg">Verifying authentication status</small>
      </div>
    </div>

    <!-- Login Card (Hidden initially, shown only when unauthenticated) -->
    <div class="card login-card shadow-lg border-0" id="loginCard" style="display: none;">
      <div
        class="card-header text-white text-center py-4"
        style="background-color: #f57d10ff"
      >
        <h3 class="fw-bold mb-0">Tom's Chicken</h3>
        <small>Login to your account</small>
      </div>
      <div class="card-body p-4">
        <div
          id="error-alert"
          class="alert alert-danger d-none"
          role="alert"
        ></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label fw-bold">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="username@example.com"
              required
            />
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold">Password</label>
            <div class="password-container">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="**********"
              required
            />
            <i class="fa-solid fa-eye-slash toggle-eye" id="togglePassword"></i>
            </div>
            <small class="text-muted"
              >Forgot your password?
              <a
                href="Resetpass.html"
                style="color: #f57d10ff; text-decoration: none"
                >Reset here</a
              ></small
            >
          </div>
          
          <!-- reCAPTCHA v2 Checkbox -->
          <div class="mb-3 d-flex justify-content-center">
            <div id="recaptcha-container"></div>
          </div>
          
          <button
            type="submit"
            id="loginBtn"
            class="btn w-100 py-2 text-white fw-bold shadow-sm"
            style="background-color: #f57d10ff"
          >
            LOGIN
          </button>
        </form>
      </div>
      <div class="card-footer text-center bg-white py-3">
        <small class="text-muted"
          >Don't have an account?
          <a href="Signup.html" style="color: #f57d10ff; text-decoration: none"
            >Sign up</a
          >
        </small>
      </div>
    </div>

    <script type="module">
      import {
        auth,
        db,
        ref,
        get,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
        RecaptchaVerifier
      } from "./js/firebase-config.js";

      const sessionCheckCard = document.getElementById("sessionCheckCard");
      const loginCard = document.getElementById("loginCard");
      const sessionStatusTitle = document.getElementById("sessionStatusTitle");
      const sessionStatusMsg = document.getElementById("sessionStatusMsg");
      const loginForm = document.getElementById("loginForm");
      const errorAlert = document.getElementById("error-alert");
      const loginBtn = document.getElementById("loginBtn");

      let recaptchaWidgetId = null;
      let recaptchaResponseToken = null;
      let recaptchaInitialized = false;
      let isRedirecting = false;

      function showLoginForm() {
        if (isRedirecting) return;
        if (sessionCheckCard) sessionCheckCard.style.display = "none";
        if (loginCard) loginCard.style.display = "block";
        initRecaptcha();
      }

      function initRecaptcha() {
        if (recaptchaInitialized) return;
        recaptchaInitialized = true;
        // Initialize reCAPTCHA v2 checkbox for bot protection on Login
        try {
          window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
            size: "normal",
            callback: (response) => {
              recaptchaResponseToken = response;
              errorAlert.classList.add("d-none");
            },
            "expired-callback": () => {
              recaptchaResponseToken = null;
              showError("reCAPTCHA expired. Please verify the checkbox again.");
            }
          });

          window.recaptchaVerifier.render().then((widgetId) => {
            recaptchaWidgetId = widgetId;
          }).catch((err) => {
            console.error("Login reCAPTCHA render error:", err);
          });
        } catch (err) {
          console.error("RecaptchaVerifier initialization error:", err);
        }
      }

      async function redirectLoggedInUser(user) {
        if (isRedirecting) return;
        isRedirecting = true;

        if (sessionCheckCard) {
          sessionCheckCard.style.display = "block";
          if (sessionStatusTitle) sessionStatusTitle.textContent = "Already Logged In";
          if (sessionStatusMsg) sessionStatusMsg.textContent = "Redirecting to your dashboard...";
        }
        if (loginCard) loginCard.style.display = "none";

        try {
          const userRef = ref(db, "users/" + user.uid);
          const snapshot = await get(userRef);
          if (snapshot.exists()) {
            const userData = snapshot.val();
            if (userData.role === "admin") {
              if (userData.status === "active") {
                window.location.replace("admin.html");
                return;
              } else {
                isRedirecting = false;
                await signOut(auth);
                showLoginForm();
                showError("Access Denied: Your admin account has been deactivated.");
                return;
              }
            } else if (userData.role === "customer") {
              window.location.replace("index.html");
              return;
            }
          }
          window.location.replace("index.html");
        } catch (err) {
          console.error("Session verification error:", err);
          isRedirecting = false;
          showLoginForm();
        }
      }

      // Check if user is already logged in on initial load
      onAuthStateChanged(auth, (user) => {
        if (user) {
          redirectLoggedInUser(user);
        } else {
          showLoginForm();
        }
      });

      // Handle Back-Forward Cache (BFCache) when navigating back
      window.addEventListener("pageshow", (event) => {
        if (auth.currentUser) {
          redirectLoggedInUser(auth.currentUser);
        }
      });

      // Safety fallback in case network/auth stalls
      setTimeout(() => {
        if (!auth.currentUser && !isRedirecting) {
          showLoginForm();
        }
      }, 3000);

      document.getElementById("togglePassword").addEventListener("click", function () {
        const passwordInput = document.getElementById("password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          this.classList.replace("fa-eye-slash", "fa-eye");
        } else {
          passwordInput.type = "password";
          this.classList.replace("fa-eye", "fa-eye-slash");
        }
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault(); // Prevents the form from submitting and refreshing the page
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;
        errorAlert.classList.add("d-none"); // Hides any previous error messages

        // Verify reCAPTCHA checkbox before proceeding
        let recaptchaResponse = recaptchaResponseToken;
        try {
          if (!recaptchaResponse && window.grecaptcha) {
            if (recaptchaWidgetId !== null) {
              recaptchaResponse = window.grecaptcha.getResponse(recaptchaWidgetId);
            }
            if (!recaptchaResponse) {
              recaptchaResponse = window.grecaptcha.getResponse();
            }
          }
          if (!recaptchaResponse && window.recaptchaVerifier && typeof window.recaptchaVerifier.getResponse === "function") {
            recaptchaResponse = window.recaptchaVerifier.getResponse();
          }
        } catch (err) {
          console.warn("Login reCAPTCHA getResponse:", err);
        }

        if (!recaptchaResponse) {
          showError("Please check the 'I'm not a robot' reCAPTCHA box before logging in.");
          return;
        }

        loginBtn.innerHTML = "Checking..."; // Change button text
        loginBtn.disabled = true; // Disables button to prevent multiple clicks

        try {
          const userCredential = await signInWithEmailAndPassword(
            // Checks if email/password exist in Firebase Authentication
            auth,
            email,
            pass,
          );
          const user = userCredential.user; //Gets UID in Firebase Authentication
          const userRef = ref(db, "users/" + user.uid); // Uses  the UID to find the user data in Firebase Realtime Database
          const snapshot = await get(userRef); // Checks if user data exists in the database and retrieves it (Like yung value yung email and role and status)
          if (snapshot.exists()) {
            const userData = snapshot.val(); // Gets user data (email, role, status) from the database
            if (userData.role === "admin") {
              if (userData.status === "active") {
                window.location.replace("admin.html");
              } else {
                showError(
                  "Access Denied: Your admin account has been deactivated.",
                );
              }
            } else if (userData.role === "customer") {
              window.location.replace("index.html");
            } else {
              showError("Error: Account role not defined.");
            }
          } else {
            showError("User data not found in database.");
          }
        } catch (error) {
          console.error(error); // Logs full error on terminal for debugging
          // Reset reCAPTCHA on failed login attempt
          try {
            if (window.grecaptcha && recaptchaWidgetId !== null) {
              window.grecaptcha.reset(recaptchaWidgetId);
            }
          } catch (e) {}

          if (error.code === "auth/invalid-credential") {
            showError("Incorrect email or password.");
          } else {
            showError("Login failed: " + error.message);
          }
        } finally {
          loginBtn.innerHTML = "LOGIN"; // Resets button text from logging in back to "LOGIN"
          loginBtn.disabled = false; // Re-enables the button
        }
      });

      function showError(msg) {
        // Function to display error messages
        errorAlert.textContent = msg;
        errorAlert.classList.remove("d-none");
      }
    </script>
  </body>
</html>
